name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: hf audit / repo-check / hyperframes lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg (ffprobe measures narration MP3 lengths)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Publication guard (allowlist, secrets, file sizes)
        run: node shared/tools/hf.mjs repo-check

      - name: Structural / schema / timing audit of every tracked project
        run: node shared/tools/hf.mjs audit --all

      - name: HyperFrames lint (static, no browser) for every tracked project
        run: |
          set -e
          for p in */projects/*/; do
            if [ -f "$p/project.json" ]; then
              echo "::group::hyperframes lint $p"
              (cd "$p" && npx --yes hyperframes@0.8.6 lint)
              echo "::endgroup::"
            fi
          done
