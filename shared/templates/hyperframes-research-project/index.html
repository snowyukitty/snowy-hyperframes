<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>HyperFrames research project</title>
    <!--
      Snowy HyperFrames research-video template.
      - Slide sections and narration <audio> clips between the hf:* markers are GENERATED
        by `hf html` from data/storyboard.json and re-timed by `hf sync`. Edit the storyboard,
        not the generated regions. Everything outside the markers (CSS, timeline JS) is yours.
      - Timing truth: data/storyboard.json + data/audio-durations.json -> data/timeline.json.
      - GSAP starts are read from each slide's data-start, so there is no second timing array to drift.
    -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* OS-bundled CJK fonts: the local() declarations satisfy `hyperframes lint`
         (font_family_without_font_face) without shipping font files. For a fully
         deterministic render across machines, vendor a .woff2 and point src at it. */
      @font-face { font-family: "Noto Sans TC"; src: local("Noto Sans TC"), local("NotoSansTC-Regular"); }
      @font-face { font-family: "PingFang TC"; src: local("PingFang TC"); }
      @font-face { font-family: "Microsoft JhengHei"; src: local("Microsoft JhengHei"), local("微軟正黑體"); }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #07090b; color: #f8f6ef;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07090b; }
      .slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; --i: 0; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* image-free slides: a lit gradient field whose hue drifts per slide (--i is set by hf html) */
      .bg-generated {
        background:
          radial-gradient(1300px 760px at 76% 30%, rgba(148, 240, 231, 0.42), transparent 62%),
          radial-gradient(980px 640px at 16% 84%, rgba(255, 213, 139, 0.30), transparent 62%),
          radial-gradient(700px 700px at 55% 60%, rgba(120, 150, 255, 0.18), transparent 70%),
          linear-gradient(135deg, #121b22 0%, #07090b 100%);
        filter: hue-rotate(calc(var(--i) * 11deg));
      }
      .bg-generated::after {
        content: ""; position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: radial-gradient(1100px 700px at 70% 45%, #000 20%, transparent 75%);
        -webkit-mask-image: radial-gradient(1100px 700px at 70% 45%, #000 20%, transparent 75%);
      }
      .shade {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, rgba(4, 7, 10, 0.92) 0%, rgba(4, 7, 10, 0.72) 45%, rgba(4, 7, 10, 0.30) 100%),
          linear-gradient(0deg, rgba(4, 6, 8, 0.94) 0%, rgba(4, 6, 8, 0.40) 38%, rgba(4, 6, 8, 0.18) 100%);
      }
      .slide.no-image .shade {
        background:
          linear-gradient(90deg, rgba(4, 7, 10, 0.78) 0%, rgba(4, 7, 10, 0.42) 48%, rgba(4, 7, 10, 0.10) 100%),
          linear-gradient(0deg, rgba(4, 6, 8, 0.88) 0%, rgba(4, 6, 8, 0.30) 40%, rgba(4, 6, 8, 0.06) 100%);
      }
      /* image-free slides: a quiet progress ring (pure SVG shapes, no text — keeps contrast/occlusion checks clean) */
      .deco {
        position: absolute; z-index: 1; right: 150px; top: 250px; width: 440px; height: 440px;
        opacity: 0.55; pointer-events: none;
      }
      .deco .track { fill: none; stroke: rgba(248, 246, 239, 0.10); stroke-width: 1.6; }
      .deco .arc { fill: none; stroke: rgba(148, 240, 231, 0.55); stroke-width: 1.6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
      .deco .dot { fill: rgba(255, 213, 139, 0.7); }
      .content { position: relative; z-index: 2; width: 1320px; padding: 92px 0 0 96px; }
      .eyebrow {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px;
        background: rgba(7, 13, 16, 0.74); color: #94f0e7;
        font-size: 24px; line-height: 1; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
      }
      h1 { max-width: 1240px; margin-top: 26px; color: #fffdf6; font-size: 76px; line-height: 1.08; font-weight: 900; }
      .caption {
        position: absolute; z-index: 3; left: 96px; right: 96px; bottom: 96px;
        padding: 26px 34px; border-radius: 10px;
        background: rgba(5, 10, 13, 0.78); border: 1px solid rgba(255, 255, 255, 0.14);
        color: #f3f1e9; font-size: 36px; line-height: 1.45; font-weight: 600;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }
      .caption:empty { display: none; }
      .progress {
        position: absolute; z-index: 3; top: 96px; right: 96px;
        color: rgba(248, 246, 239, 0.72); font-size: 26px; font-weight: 700; letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      .narration-audio { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

      /* ---------------------------------------------------------------------
         Content blocks — the information layer of a research slide.
         Generated by `hf html` from data/storyboard.json slides[].blocks.

         Layout contract: on a slide with blocks the content column becomes a
         fixed band (top 92px -> 860px, i.e. above the lower-third caption) and
         the block group is optically centred inside whatever the title leaves.
         Type is sized for "read it at a glance from across the room", because a
         research slide gets ~15 seconds of a viewer's attention. Every surface
         carrying small text paints its own dark panel, so contrast holds no
         matter how bright the background art is.
         --------------------------------------------------------------------- */
      .slide.with-blocks .content {
        position: absolute; inset: 92px 96px 220px 96px; width: auto; padding: 0;
        display: flex; flex-direction: column;
      }
      .slide.with-blocks h1 { max-width: 1560px; margin-top: 22px; font-size: 60px; line-height: 1.1; }
      .slide.with-blocks .shade {
        background:
          linear-gradient(90deg, rgba(4, 7, 10, 0.90) 0%, rgba(4, 7, 10, 0.80) 58%, rgba(4, 7, 10, 0.66) 100%),
          linear-gradient(0deg, rgba(4, 6, 8, 0.92) 0%, rgba(4, 6, 8, 0.56) 44%, rgba(4, 6, 8, 0.30) 100%);
      }
      .blocks {
        flex: 1; min-height: 0; margin-top: 30px;
        display: flex; flex-direction: column; justify-content: center; gap: 26px;
      }

      .lead { max-width: 1560px; color: #eef3ef; font-size: 40px; line-height: 1.38; font-weight: 620; }

      /* Cap each cell so a 2-up row does not stretch into two half-empty billboards. */
      .metrics {
        display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 22px;
        max-width: min(100%, calc(var(--n, 3) * 470px + (var(--n, 3) - 1) * 22px));
      }
      .metric {
        display: flex; flex-direction: column; justify-content: center;
        min-height: 212px; padding: 30px 32px; border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(4, 11, 14, 0.80);
        border-top: 3px solid rgba(148, 240, 231, 0.65);
      }
      .metric .label { color: #94f0e7; font-size: 25px; line-height: 1.2; font-weight: 820; }
      .metric .value {
        margin-top: 12px; color: #ffe6a3; font-size: 66px; line-height: 1.04; font-weight: 900;
        letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
      }
      .metric .note { margin-top: 12px; color: #d7ded8; font-size: 23px; line-height: 1.32; }

      .cards {
        display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 22px;
        max-width: min(100%, calc(var(--n, 3) * 540px + (var(--n, 3) - 1) * 22px));
      }
      .card {
        min-height: 224px; padding: 32px 34px; border-radius: 12px;
        border-left: 6px solid #94f0e7; background: rgba(5, 12, 15, 0.80);
      }
      .card strong { display: block; color: #fffdf6; font-size: 38px; line-height: 1.16; font-weight: 850; }
      .card p { margin-top: 16px; color: #dae2dc; font-size: 27px; line-height: 1.38; }

      .list { max-width: 1560px; display: grid; gap: 20px; list-style: none; padding-left: 0; counter-reset: hf; }
      .list li {
        position: relative; padding-left: 56px; color: #eef3ef;
        font-size: 38px; line-height: 1.34; font-weight: 620;
      }
      ul.list li::before {
        content: ""; position: absolute; left: 8px; top: 24px;
        width: 26px; height: 3px; background: #94f0e7;
      }
      ol.list li::before {
        content: counter(hf); counter-increment: hf; position: absolute; left: 0; top: 0;
        color: #94f0e7; font-weight: 900; font-variant-numeric: tabular-nums;
      }

      .quote {
        max-width: 1560px; padding: 34px 42px; border-radius: 0 12px 12px 0;
        border-left: 6px solid #ffd58b; background: rgba(5, 12, 15, 0.78);
      }
      .quote p { color: #fffdf6; font-size: 48px; line-height: 1.34; font-weight: 750; }
      .quote figcaption { margin-top: 18px; color: #cbd4cd; font-size: 24px; font-weight: 620; }

      .source { color: #c5ccc6; font-size: 23px; line-height: 1.35; font-weight: 600; }

      /* ---- chart ---------------------------------------------------------
         Bars and splits are HTML boxes so CJK labels and tabular numerals
         render as real text; only the line is SVG, where geometry is the point.
         Every fill animates by transform (never width) so no frame re-lays out. */
      .chart { max-width: 1560px; display: flex; flex-direction: column; gap: 16px; }
      .chart figcaption { color: #b9c1bb; font-size: 20px; line-height: 1.35; font-weight: 600; }
      .chart figcaption:empty { display: none; }

      .chart-bar .row {
        display: grid; grid-template-columns: minmax(180px, 300px) 1fr minmax(150px, auto);
        align-items: center; gap: 22px;
      }
      .chart-bar .rl { color: #eef3ef; font-size: 28px; font-weight: 700; }
      .chart-bar .rt { height: 34px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
      .chart-bar .rf {
        display: block; height: 100%; border-radius: 4px; background: #94f0e7;
        transform: scaleX(var(--p, 0)); transform-origin: left center;
      }
      .chart-bar .row:nth-child(even) .rf { background: #ffe6a3; }
      .chart-bar .row[data-emphasis] .rf { background: #ffb4a2; }
      .chart-bar .rv {
        color: #fffdf6; font-size: 34px; font-weight: 900; text-align: right;
        font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
      }
      .chart-bar .ru { margin-left: 8px; color: #b9c1bb; font-size: 20px; font-weight: 700; }

      .chart-split .splitbar { display: flex; height: 62px; border-radius: 6px; overflow: hidden; transform-origin: left center; }
      .chart-split .seg {
        flex: var(--p, 1) 1 0; display: grid; place-items: center; min-width: 0;
        color: #06231f; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums;
      }
      .chart-split .seg[data-i="0"] { background: #94f0e7; }
      .chart-split .seg[data-i="1"] { background: #ffe6a3; }
      .chart-split .seg[data-i="2"] { background: #b6c8f0; }
      .chart-split .seg[data-i="3"] { background: #ffb4a2; }
      .chart-split .splitkey { display: flex; gap: 26px; flex-wrap: wrap; }
      .chart-split .splitkey span { position: relative; padding-left: 26px; color: #eef3ef; font-size: 24px; font-weight: 700; }
      .chart-split .splitkey span::before {
        content: ""; position: absolute; left: 0; top: 8px; width: 16px; height: 16px; border-radius: 4px;
      }
      .chart-split .splitkey span[data-i="0"]::before { background: #94f0e7; }
      .chart-split .splitkey span[data-i="1"]::before { background: #ffe6a3; }
      .chart-split .splitkey span[data-i="2"]::before { background: #b6c8f0; }
      .chart-split .splitkey span[data-i="3"]::before { background: #ffb4a2; }

      .chart-line .lines { width: 100%; height: 360px; display: block; }
      .chart-line .grid { stroke: rgba(255, 255, 255, 0.10); stroke-width: 1.5; }
      .chart-line .ln {
        fill: none; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 0;
      }
      .chart-line .ln[data-i="0"] { stroke: #94f0e7; }
      .chart-line .ln[data-i="1"] { stroke: #ffe6a3; }
      .chart-line .dot[data-i="0"] { fill: #94f0e7; }
      .chart-line .dot[data-i="1"] { fill: #ffe6a3; }
      .chart-line .linekey { display: flex; gap: 26px; flex-wrap: wrap; }
      .chart-line .linekey span { display: inline-flex; align-items: center; gap: 9px; color: #eef3ef; font-size: 24px; font-weight: 700; }
      .chart-line .linekey b { color: #fffdf6; font-variant-numeric: tabular-nums; }
      .chart-line .linekey i { width: 22px; height: 3px; border-radius: 2px; }
      .chart-line .linekey span[data-i="0"] i { background: #94f0e7; }
      .chart-line .linekey span[data-i="1"] i { background: #ffe6a3; }
      .chart-line .lineaxis { display: flex; justify-content: space-between; color: #b9c1bb; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

      /* Chapter accents. `hf html` emits `chapter-<slug>` from the storyboard's
         chapter field (namespaced so a chapter named "quote" or "list" cannot
         collide with the block vocabulary). Recolour a chapter by adding rules
         here; the defaults below just tint the eyebrow. */
      .slide[class*="chapter-"] .eyebrow { color: #94f0e7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <!-- hf:audio:start -->
      <!-- hf:audio:end -->

      <!-- hf:slides:start -->
      <!-- hf:slides:end -->
    </div>

    <script>
      // Per-slide entrance motion. Positions come from the DOM (data-start), so `hf sync`
      // only has to rewrite attributes and this script never drifts from the timeline.
      //
      // A slide may pick a motion with data-motion (emitted by `hf html` from the
      // storyboard). Four is the whole vocabulary on purpose: a rhythm that needs a
      // legend is a design system, not a rhythm.
      //   rise   — the default arrival
      //   hold   — background only; the text is already on screen (continuing a thought)
      //   focus  — a slow push-in, the title lands late (chapter openings, closings)
      //   reveal — the evidence arrives after the sentence that sets it up (findings)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const addIfFound = (selector, vars, position) => {
        const targets = document.querySelectorAll(selector);
        if (targets.length > 0) tl.from(targets, vars, position);
      };
      const MOTION = {
        rise:   { bgScale: 1.055, bgDur: 1.35, text: 0.20, blocks: 0.72, chart: 1.00, cap: 0.90 },
        hold:   { bgScale: 1.020, bgDur: 0.90, text: null, blocks: null, chart: 0.40, cap: 0.30 },
        focus:  { bgScale: 1.120, bgDur: 3.00, text: 0.50, blocks: 1.20, chart: 1.50, cap: 1.40 },
        reveal: { bgScale: 1.030, bgDur: 1.10, text: 0.15, blocks: 1.10, chart: 1.40, cap: 0.70 },
      };
      document.querySelectorAll("#root > .slide").forEach((slide) => {
        const start = Number(slide.dataset.start || 0);
        const m = MOTION[slide.dataset.motion] || MOTION.rise;
        const s = `#${slide.id}`;
        addIfFound(`${s} .bg`, { scale: m.bgScale, opacity: 0.84, duration: m.bgDur, ease: "power2.out" }, start);
        if (m.text !== null) {
          addIfFound(`${s} .eyebrow`, { opacity: 0, y: 16, duration: 0.52, ease: "power2.out" }, start + m.text);
          addIfFound(`${s} h1`, { opacity: 0, y: 34, duration: 0.78, ease: "power2.out" }, start + m.text + 0.16);
          addIfFound(`${s} .progress`, { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, start + m.text + 0.4);
        }
        if (m.blocks !== null) addIfFound(`${s} .blocks > *`, { opacity: 0, y: 26, duration: 0.7, stagger: 0.12, ease: "power2.out" }, start + m.blocks);
        // charts draw themselves in: bars and splits grow by transform, lines draw along
        // pathLength="1" — all seek-safe, none of them re-layout a frame.
        addIfFound(`${s} .chart-bar .rf`, { scaleX: 0, duration: 0.9, stagger: 0.1, ease: "power2.out" }, start + m.chart);
        addIfFound(`${s} .chart-split .splitbar`, { scaleX: 0, duration: 0.9, ease: "power2.out" }, start + m.chart);
        addIfFound(`${s} .chart-line .ln`, { strokeDashoffset: 1, duration: 1.2, stagger: 0.15, ease: "power1.inOut" }, start + m.chart);
        addIfFound(`${s} .chart-line .dot`, { opacity: 0, duration: 0.4, ease: "power2.out" }, start + m.chart + 0.9);
        addIfFound(`${s} .caption`, { opacity: 0, y: 30, duration: 0.66, ease: "power2.out" }, start + m.cap);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
